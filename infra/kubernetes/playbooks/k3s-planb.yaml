# PLAN B (ADR-005) : UNIQUEMENT si kubeadm est instable. Remplace common/control-plane/workers.
# k3s embarque Flannel et local-path : mettre à jour les ADR 006/007. Traefik est désactivé ici.
- name: k3s server
  hosts: control_plane
  become: true
  vars_files: ["../versions.yaml"]
  tasks:
    - name: Installer k3s server
      ansible.builtin.shell: >
        curl -sfL https://get.k3s.io |
        INSTALL_K3S_VERSION={{ k3s_version }}
        INSTALL_K3S_EXEC="server --node-ip {{ node_ip }} --tls-san {{ bastion_fip }}
        --cluster-cidr {{ pod_cidr }} --service-cidr {{ service_cidr }}
        --flannel-backend=vxlan --disable traefik"
        sh -
      args:
        creates: /usr/local/bin/k3s
    - name: Lire le token
      ansible.builtin.slurp: { src: /var/lib/rancher/k3s/server/node-token }
      register: k3s_token

- name: k3s agents
  hosts: workers
  become: true
  vars_files: ["../versions.yaml"]
  tasks:
    - name: Installer k3s agent
      ansible.builtin.shell: >
        curl -sfL https://get.k3s.io |
        INSTALL_K3S_VERSION={{ k3s_version }}
        K3S_URL=https://{{ hostvars[groups['control_plane'][0]].node_ip }}:6443
        K3S_TOKEN={{ hostvars[groups['control_plane'][0]].k3s_token.content | b64decode | trim }}
        INSTALL_K3S_EXEC="agent --node-ip {{ node_ip }}"
        sh -
      args:
        creates: /usr/local/bin/k3s
