# Valeurs de départ (nœuds 6 Go) : à ajuster après mesure.
apiVersion: v1
kind: ResourceQuota
metadata: { name: quota, namespace: mlops }
spec:
  hard: { requests.cpu: "3", requests.memory: 4Gi, limits.cpu: "5", limits.memory: 6Gi, persistentvolumeclaims: "10" }
---
apiVersion: v1
kind: ResourceQuota
metadata: { name: quota, namespace: models }
spec:
  hard: { requests.cpu: "3", requests.memory: 4Gi, limits.cpu: "5", limits.memory: 6Gi }
---
apiVersion: v1
kind: ResourceQuota
metadata: { name: quota, namespace: monitoring }
spec:
  hard: { requests.cpu: "2", requests.memory: 3Gi, limits.cpu: "3", limits.memory: 4Gi, persistentvolumeclaims: "5" }
---
# Valeurs par défaut : sans elles, un pod sans requests/limits est refusé dès qu'un quota existe.
apiVersion: v1
kind: LimitRange
metadata: { name: defaults, namespace: mlops }
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 100m, memory: 128Mi }
      default: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: LimitRange
metadata: { name: defaults, namespace: models }
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 100m, memory: 128Mi }
      default: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: LimitRange
metadata: { name: defaults, namespace: monitoring }
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 50m, memory: 128Mi }
      default: { cpu: 500m, memory: 768Mi }
