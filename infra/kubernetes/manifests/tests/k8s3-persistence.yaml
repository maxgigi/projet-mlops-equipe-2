# Test K8S-3 : le fichier écrit doit survivre au redémarrage du pod.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: test-pvc, namespace: default }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Pod
metadata: { name: test-pvc-pod, namespace: default }
spec:
  containers:
    - name: w
      image: busybox:1.36
      command: ["sh", "-c", "[ -f /data/test.txt ] || echo persistant > /data/test.txt; cat /data/test.txt; sleep 3600"]
      volumeMounts: [{ name: d, mountPath: /data }]
      resources: { requests: { cpu: 50m, memory: 32Mi }, limits: { cpu: 100m, memory: 64Mi } }
  volumes:
    - name: d
      persistentVolumeClaim: { claimName: test-pvc }
