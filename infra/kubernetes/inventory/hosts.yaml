# À REMPLIR avec les IP relevées (openstack server list).
# ansible_host : IP de connexion SSH ; node_ip : IP privée du nœud (réseau tenant).
all:
  vars:
    ansible_user: ubuntu                        # si on utilise ubuntu
    ansible_ssh_private_key_file: ~/.ssh/PrivateKey
    bastion_fip: "FIP"             # floating IP du control plane
  children:
    control_plane:
      hosts:
        cp:
          ansible_host: "FIP"
          node_ip: "PRIVATE_IP"
    workers:
      vars:
        ansible_ssh_common_args: "-o ProxyJump={{ ansible_user }}@{{ bastion_fip }} -o StrictHostKeyChecking=accept-new"
      hosts:
        worker1:
          ansible_host: "PRIVATE_IP_W1"
          node_ip: "PRIVATE_IP_W1"
        worker2:
          ansible_host: "PRIVATE_IP_W2"
          node_ip: "PRIVATE_IP_W2"
        worker3:
          ansible_host: "PRIVATE_IP_W3"
          node_ip: "PRIVATE_IP_W3"
    k8s:
      children:
        control_plane:
        workers:
