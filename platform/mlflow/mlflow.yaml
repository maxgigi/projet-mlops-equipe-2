# Serveur MLflow : tracking + Model Registry, artefacts servis via RustFS.
# Accès hors cluster : NodePort 30500 (http://<IP d'un nœud>:30500).
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  labels:
    app: mlflow
spec:
  type: NodePort
  selector:
    app: mlflow
  ports:
    - name: http
      port: 5000
      targetPort: http
      nodePort: 30500
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  labels:
    app: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: mlflow
          image: mlops/mlflow-server
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: mlflow-secrets, key: POSTGRES_USER}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: mlflow-secrets, key: POSTGRES_PASSWORD}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: {name: mlflow-secrets, key: POSTGRES_DB}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: {name: mlflow-secrets, key: RUSTFS_ACCESS_KEY}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: mlflow-secrets, key: RUSTFS_SECRET_KEY}
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: MLFLOW_S3_ENDPOINT_URL
              value: http://rustfs:9000
            # Jobs GenAI inutiles ici : ~1,7 Gio économisés (ADR-004).
            - name: MLFLOW_SERVER_ENABLE_JOB_EXECUTION
              value: "false"
            # En-têtes Host acceptés : nom du Service (appels internes, KServe)
            # et IP privées (NodePort, floating IP). Défaut MLflow : localhost
            # et IP privées seulement, ce qui refuserait le nom du Service.
            - name: MLFLOW_SERVER_ALLOWED_HOSTS
              value: >-
                localhost,localhost:*,127.0.0.1:*,mlflow,mlflow:*,mlflow.mlops:*,
                mlflow.mlops.svc:*,mlflow.mlops.svc.cluster.local:*,
                10.*,172.*,192.168.*
          args:
            - mlflow
            - server
            - --backend-store-uri
            - postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
            - --artifacts-destination
            - s3://mlflow/mlflow-artifacts
            - --serve-artifacts
            - --host
            - 0.0.0.0
            - --port
            - "5000"
            - --workers
            - "2"
          # Premier démarrage : création du schéma dans PostgreSQL.
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            failureThreshold: 3
          # Mesuré au repos : ~560-620 Mio avec 2 workers (ADR-004).
          resources:
            requests: {cpu: 250m, memory: 768Mi}
            limits: {cpu: "1", memory: 1Gi}
